<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS (Optional for interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* Center the container vertically and horizontally */
        .full-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Full viewport height */
        }
    </style>
</head>
<body class="bg-light">

    <!-- Container to center the content on the page -->
    <div class="full-screen">
        <!-- Profile Card -->
        <div class="card" style="width: 25rem; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);">
            <!-- Profile Image at the top (Square shape) -->
            <img src="./assets/images/person-2.jpg" alt="Profile Image" class="card-img-top" style="width: 150px; height: 150px; margin-top: 20px; margin-left: auto; margin-right: auto;">
            
            <div class="card-body">
                <!-- Flex container for Name and Like icon -->
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <!-- Name label and name in bold with reduced left margin -->
                    <h5 class="mb-0" style="margin-left: 5px;">Name:</h5>
                    <span class="fw-bold" style="font-size: 24px; margin-left: -150px;">John Doe</span> <!-- Reduced left margin on name -->
                    <!-- Like icon -->
                    <span class="fs-4">❤️</span>
                </div>
                <!-- Bigger Profile Description -->
                <p class="mb-0 text-muted" style="font-size: 14px;">
                    John Doe is a software developer with a passion for coding and technology. He has been working in the industry for over 5 years, specializing in web development and full-stack applications. Outside of work, John enjoys playing video games, hiking, and photography.
                </p>
            </div>
        </div>
    </div>

</body>
</html>
