<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup/Login Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #89f7fe, #66a6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      width: 400px;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: #66a6ff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover {
      background: #4e89ff;
    }

    .toggle-link {
      margin-top: 15px;
      font-size: 14px;
      color: #66a6ff;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container" id="form-container">
    <h2 id="form-title">Signup</h2>
    <form id="signup-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="signup-email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="signup-password" placeholder="Enter your password" required>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Confirm your password" required>
      </div>
      <button type="button" class="btn" onclick="signup()">Signup</button>
      <p class="toggle-link" onclick="toggleForm()">Already have an account? Login</p>
    </form>

    <form id="login-form" style="display: none;">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="login-email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" required>
      </div>
      <button type="button" class="btn" onclick="login()">Login</button>
      <p class="toggle-link" onclick="toggleForm()">Don't have an account? Signup</p>
    </form>
  </div>

  <script>
    // Function to toggle between signup and login forms
    function toggleForm() {
      const signupForm = document.getElementById('signup-form');
      const loginForm = document.getElementById('login-form');
      const formTitle = document.getElementById('form-title');
      
      if (signupForm.style.display === 'none') {
        signupForm.style.display = 'block';
        loginForm.style.display = 'none';
        formTitle.textContent = 'Signup';
      } else {
        signupForm.style.display = 'none';
        loginForm.style.display = 'block';
        formTitle.textContent = 'Login';
      }
    }

    // Mock data storage
    let users = {};

    // Signup function
    function signup() {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        alert('Passwords do not match!');
        return;
      }

      if (users[email]) {
        alert('User already exists!');
        return;
      }

      users[email] = password;
      alert('Signup successful! Please login.');
      toggleForm();
    }

    // Login function
    function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (users[email] && users[email] === password) {
        alert('Login successful!');
      } else {
        alert('Invalid email or password!');
      }
    }
  </script>
</body>
</html>
